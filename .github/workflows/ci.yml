name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token: CI checks code, it never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (typecheck, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci --no-audit --no-fund

      # Each check runs even if an earlier one failed, so one run reports every problem.
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      # Through the npm script, so the pinned Biome is used: `npx biome` would
      # fetch an unrelated package of that name if Biome weren't installed.
      - name: Lint and format (Biome)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint:ci

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

  python:
    name: Python (format, lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11" # the oldest version the project supports
          enable-cache: true
          cache-dependency-glob: py/uv.lock

      - name: Install dependencies
        id: install
        run: uv sync --locked

      - name: Format check (Ruff)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff format --check

      - name: Lint (Ruff)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff check --output-format=github

      - name: Type check (mypy, strict)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run mypy

      - name: Tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pytest
