[project]
name = "job-agent-py"
version = "0.1.0"
description = "Data side of the personal agent: labeling, evals, prompt experiments"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "ruff==0.15.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["db.py", "label.py", "explore.py", "data.py", "classify.py", "eval_classify.py", "tests"]
plugins = ["pydantic.mypy"]

# Tests are type-checked for mistakes, but fixtures and test functions don't need annotations.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pep8-naming, bugbear, pyupgrade, simplify, ruff-specific
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Maintainer exercise scaffolding (see CLAUDE.md): imports provided for the
# functions still to be written, and the spec file's short `R` result helper.
"eval_classify.py" = ["F401"]
"tests/test_eval_classify.py" = ["N802"]
