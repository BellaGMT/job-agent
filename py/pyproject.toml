[project]
name = "job-agent-py"
version = "0.1.0"
description = "Data side of the personal agent: labeling, evals, prompt experiments"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["label.py", "explore.py", "data.py", "classify.py", "eval_classify.py", "tests"]
plugins = ["pydantic.mypy"]

# Tests are type-checked for mistakes, but fixtures and test functions don't need annotations.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.uv]
package = false
